{{define "content"}}
{{template "message_screen" .}}

<section id="screen-picker" class="screen hidden" data-tour-screen="hc_scan.picker">
  <h1>{{.T "hc.title"}}</h1>
  <p class="muted">{{.T "hc.ui.pick_process"}}</p>
  <div id="process-buttons" class="process-buttons"{{.Tour "hc.tour.picker"}}></div>
  <p class="muted small" id="picker-user"></p>
</section>

<div id="screen-app" class="hidden" data-tour-screen="hc_scan.board">
  <div class="pagebar" id="pagebar" data-tour-sticky>
    <div class="title">
      <span id="process-name" class="process-name"></span>
    </div>
    <div class="controls"{{.Tour "hc.tour.controls"}}>
      <input id="date" type="date" aria-label="{{.T "hc.ui.date_label"}}">
      <div class="seg" role="group" aria-label="{{.T "hc.ui.shift_label"}}">
        <button id="shift-AM" type="button" class="seg-btn">AM</button>
        <button id="shift-PM" type="button" class="seg-btn">PM</button>
      </div>
      <button id="change-process" type="button" class="btn ghost">{{.T "hc.ui.change_process"}}</button>
    </div>
    <div class="counters" id="counters"{{.Tour "hc.tour.counters"}}></div>
  </div>

  <div id="locked-banner" class="banner warn hidden"{{.Tour "hc.tour.locked"}}>{{.T "hc.ui.locked"}}</div>

  <main class="layout">
    <section class="left">
      <div class="scan-block" data-tour-sticky>
      <div id="scan-panel" class="scan-panel"{{.Tour "hc.tour.scan"}}>
        <div id="target-banner" class="target-banner hidden">
          <span id="target-banner-text" class="target-banner-text"></span>
          <button id="target-cancel" type="button" class="btn ghost target-cancel">{{.T "hc.ui.target_cancel"}}</button>
        </div>
        <label for="scan" class="scan-label">{{.T "hc.ui.scan_label"}}</label>
        <input id="scan" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="{{.T "hc.ui.scan_placeholder"}}">
      </div>

      <div id="result" class="result idle"{{.Tour "hc.tour.result"}}>
        <div class="result-idle">{{.T "hc.ui.ready"}}</div>
      </div>
      </div>

      <div class="panel-head">
        <h2>{{.T "hc.ui.scanned"}} <span id="pending-count" class="pill">0</span></h2>
        <div class="actions"{{.Tour "hc.tour.actions"}}>
          <button id="reset" type="button" class="btn ghost">{{.T "hc.ui.clear_draft"}}</button>
          <button id="confirm" type="button" class="btn primary">{{.T "hc.ui.confirm"}}</button>
        </div>
      </div>
      <p class="muted small">{{.T "hc.ui.draft_hint"}}</p>
      <div id="entries" class="entries"{{.Tour "hc.tour.entries"}}></div>
    </section>

    <aside class="right">
      <div class="panel-head"><h2>{{.T "hc.ui.not_assigned"}} <span id="missing-count" class="pill">0</span></h2><span class="muted small">{{.T "hc.ui.missing_hint"}}</span></div>
      <div id="missing" class="missing"{{.Tour "hc.tour.missing"}}></div>
      <div class="candidate-bar" id="candidate-bar"{{.Tour "hc.tour.candidates"}}>
        <button id="btn-other-shift" type="button" class="btn ghost candidate-btn"><span id="other-shift-label">{{.T "hc.ui.other_shift_btn_base"}}</span> <span id="other-shift-count" class="pill">0</span></button>
        <button id="btn-off-day" type="button" class="btn ghost candidate-btn">{{.T "hc.ui.off_day_btn"}} <span id="off-day-count" class="pill">0</span></button>
        <button id="btn-other-process" type="button" class="btn ghost candidate-btn">{{.T "hc.ui.other_process_btn"}} <span id="other-process-count" class="pill">0</span></button>
      </div>
      <div class="panel-head"><h2>{{.T "hc.ui.machines"}}</h2><span id="mtr-info" class="muted small"></span></div>
      <div id="machines" class="machines"{{.Tour "hc.tour.machines"}}></div>
    </aside>
  </main>
</div>

<dialog id="dialog"></dialog>
<dialog id="candidate-dialog" class="candidate-dialog"></dialog>
<dialog id="mtr-dialog" class="mtr-dialog"></dialog>
{{end}}
